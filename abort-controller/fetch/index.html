<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5 API - Abort Controller Fetch</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <hgroup>
          <h1>Abort Controller Fetch</h1>
          <p>Demo of request cancellation using the browser Fetch API.</p>
        </hgroup>
      </header>

      <section class="demo-grid">
        <article>
          <h2>Actions</h2>
          <div class="actions">
            <button id="download-btn" type="button">Download video</button>
            <button id="abort-btn" class="secondary hidden" type="button">
              Cancel download
            </button>
          </div>
          <p id="reports" role="status" aria-live="polite"></p>
        </article>

        <article id="video-wrapper" class="hidden">
          <h2>Video</h2>
          <p>
            Sintel &copy; copyright Blender Foundation |
            <a href="http://www.sintel.org/">www.sintel.org</a>.
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
