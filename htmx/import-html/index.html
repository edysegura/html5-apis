<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTMX 4</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta6"
      integrity="sha384-6lyVbhrs13b9z7mLOpt/N6R76rtkEBWgCjAXRs/DSWyi2AMnQSs10ijWk+PI8n7W"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="demo-panel" aria-labelledby="page-title">
        <h1 id="page-title">HTMX 4</h1>
        <p>
          Load a partial HTML response into the page without a full refresh.
        </p>

        <div class="actions">
          <button hx-get="partials/messages.html" hx-target="#messages">
            Load Messages
          </button>
        </div>

        <div id="messages" role="status" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
